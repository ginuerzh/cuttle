gateway:
  listen: ":8787"

admin:
  listen: "127.0.0.1:8788"
  passwordHash: ""          # generate with: llm-gw hash-password < password.txt
  sessionTTL: 12h

stats:
  path: "stats.sqlite"
  retainRequests: 168h
  retainRollups: 2160h
  storeBody: false

effort:
  lowThreshold: 1024
  mediumThreshold: 4096
  highThreshold: 16384

aliases:
  - match: "claude-opus*"
    model: strong
  - match: "gpt-5.5*"
    model: strong
  - match: "claude-sonnet*"
    model: fast
  - match: "gpt-4.5*"
    model: fast
  - match: "claude-haiku*"
    model: fast
  - match: "*"
    model: fast

# A provider is only the endpoint: how to connect and authenticate.
providers:
  - name: deepseek
    baseURL: https://api.deepseek.com
    protocol: openai
    keys:
      - ${DEEPSEEK_API_KEY}
    pathMap:
      /v1/chat/completions: /chat/completions
      /v1/responses: /chat/completions
    health:
      path: /models
      interval: 30s
      timeout: 5s

# A node is one concrete use of a provider: model mapping + routing policy.
# The same provider can back several nodes with different mappings.
nodes:
  - name: deepseek-fast
    provider: deepseek
    models:
      fast: deepseek-v4-flash
      "*": deepseek-v4-flash

  # Optional: same provider, but high-effort requests get the stronger model.
  # tier=high nodes win over the base pool via the matcher priority.
  - name: deepseek-strong
    provider: deepseek
    tier: high
    models:
      fast: deepseek-v4-pro
      strong: deepseek-v4-pro

routes:
  - name: strong
    nodes: [deepseek-strong]
    match:
      model: strong
  - name: fast
    nodes: [deepseek-fast, deepseek-strong]
    match:
      model: fast
