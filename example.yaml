gateway:
  listen: ":8787"

admin:
  listen: "127.0.0.1:8788"
  passwordHash: ""          # generate with: llm-gw hash-password < password.txt
  sessionTTL: 12h

stats:
  path: "stats.sqlite"
  retainRequests: 168h
  retainRollups: 2160h
  storeBody: false

# Level can be changed at runtime with SIGHUP or an admin config save. Format
# is fixed at startup; changing it requires a restart.
log:
  level: info    # trace | debug | info | warn | error | fatal
  format: json   # json | text

# An entrypoint is the client-facing ingress. Its match globs are checked in
# declaration order; the first entrypoint with a matching client model wins.
entrypoints:
  - name: strong
    match:
      - "claude-opus*"
      - "gpt-5.5*"
    route: strong
  - name: fast
    match:
      - "claude-sonnet*"
      - "gpt-4.5*"
      - "claude-haiku*"
    route: fast
  - name: default
    match: ["*"]
    route: fast

# A provider declares which wire APIs it serves and where; type selects the
# adapter. An empty API field means the provider does not serve that API.
providers:
  - name: deepseek
    type: deepseek
    chat: https://api.deepseek.com/v1
    responses: https://api.deepseek.com/v1
    anthropic: https://api.deepseek.com/anthropic
    keys:
      - ${DEEPSEEK_API_KEY}
    health:
      api: chat
      interval: 30s
      timeout: 5s
    # Local per-model overrides. A disabled model stays in the catalog, but the
    # Node model picker hides it and routes targeting it skip this node.
    # models:
    #   deepseek-v4-flash:
    #     disabled: true

# A node binds one provider model plus routing policy. backup: true makes it a
# fallback; weight controls the round-robin share.
nodes:
  - name: deepseek-fast
    provider: deepseek
    model: deepseek-v4-flash
  - name: deepseek-strong
    provider: deepseek
    model: deepseek-v4-pro

# A route contains only nodes and a selection strategy. The entrypoint decides
# which route handles a request.
routes:
  - name: strong
    nodes: [deepseek-strong]
    strategy: round
  - name: fast
    nodes: [deepseek-fast]
    strategy: round
