# Optional with the zero-config flow: `cuttle serve` with no `-c` generates
# $CUTTLE_DATA/cuttle.yaml and uses the admin console for first-run setup.
# This file is the full manual configuration for multi-provider topologies.
#
# Every entity carries an immutable `id`; the `name` is a display label you may
# edit at any time. The console generates ids for the entities it creates. A
# hand-written file may omit them: the loader derives ids, rewrites the file and
# keeps the previous version as `<path>.bak-<unix>`. Keep the `id` lines when
# renaming an entity in a hand-maintained (for example read-only) config, or a
# reload will treat the new name as a new identity.
gateway:
  listen: ":8787"
  # Data-plane access keys. Empty or absent keeps the gateway open.
  # keys:
  #   - id: gk_5x2m4q7a9k
  #     name: claude-code
  #     key: ${CLAUDE_GATEWAY_KEY}
  #   - id: gk_1c7f3b8n2v
  #     name: disabled-example
  #     key: sk-gw-example
  #     enabled: false

admin:
  listen: "127.0.0.1:8788"
  passwordHash: ""          # generate with: cuttle hash-password < password.txt
  sessionTTL: 12h

stats:
  path: "stats.sqlite"
  retainRequests: 168h
  retainRollups: 2160h
  # Bounded body capture. Off by default; `errors` keeps failed requests,
  # `sample` keeps a random subset. See README for on-demand capture.
  capture:
    mode: off          # off | errors | sample
    sampleRate: 0.01
    maxBytes: 32768
    retain: 24h

# Level can be changed at runtime with SIGHUP or an admin config save. Format
# is fixed at startup; changing it requires a restart.
log:
  level: info    # trace | debug | info | warn | error | fatal
  format: json   # json | text

# An entrypoint is the client-facing ingress. Its match globs are checked in
# declaration order; the first entrypoint with a matching client model wins.
# `route` is the id of the route it selects.
entrypoints:
  - id: e_q7a4m2xk9d
    name: strong
    match:
      - "claude-opus*"
      - "gpt-5.5*"
    route: r_f3k9x2m4qa
  - id: e_2v8n5b1c7f
    name: fast
    match:
      - "claude-sonnet*"
      - "gpt-4.5*"
      - "claude-haiku*"
    route: r_7d2n5v8b1e
  - id: e_9m3k7a1x5q
    name: default
    match: ["*"]
    route: r_7d2n5v8b1e

# A provider declares which wire APIs it serves and where; type selects the
# adapter. An empty API field means the provider does not serve that API.
providers:
  - id: p_3k9x2m4q7a
    name: deepseek
    type: deepseek
    chat: https://api.deepseek.com/v1
    responses: https://api.deepseek.com/v1
    anthropic: https://api.deepseek.com/anthropic
    keys:
      - id: pk_8m2xq7a4k9
        name: default
        key: "${DEEPSEEK_API_KEY}"
    health:
      api: chat
      interval: 30s
      timeout: 5s
    # Local per-model overrides. A disabled model stays in the catalog, but the
    # Node model picker hides it and routes targeting it skip this node.
    # models:
    #   deepseek-v4-flash:
    #     disabled: true

  # OpenRouter exposes Chat, Responses and Anthropic Messages with one key.
  # - id: p_9q3k7a1x5m
  #   name: openrouter
  #   type: openrouter
  #   chat: https://openrouter.ai/api/v1
  #   responses: https://openrouter.ai/api/v1
  #   anthropic: https://openrouter.ai/api
  #   keys:
  #     - id: pk_2x5m7a9q3k
  #       name: default
  #       key: "${OPENROUTER_API_KEY}"

# A node binds one provider model plus routing policy. `provider` and the
# optional `key` pin are ids, not names. backup: true makes it a fallback;
# weight controls the round-robin share.
nodes:
  - id: n_4q7a9x2m3k
    name: deepseek-fast
    provider: p_3k9x2m4q7a
    model: deepseek-v4-flash
    key: pk_8m2xq7a4k9   # pin this node to one provider key; omit to spread across all enabled keys
    # api: auto   # auto matches the client protocol; pin chat/responses/anthropic/gemini to force one
  - id: n_6b1w8z3p5c
    name: deepseek-strong
    provider: p_3k9x2m4q7a
    model: deepseek-v4-pro

# A route holds an ordered node list of node ids, a selection strategy and an
# optional retry budget. The entrypoint decides which route handles a request.
routes:
  - id: r_f3k9x2m4qa
    name: strong
    nodes: [n_6b1w8z3p5c]
    strategy: round
    maxFails: 2
    failTimeout: 30s
    # Opt-in retry budget: extra upstream attempts (0 disables, max 10) and the
    # statuses that trigger a retry. A retry re-selects through the strategy, so
    # this single-node route re-selects deepseek-strong for its one retry; use
    # retries on a multi-node route to fail over to a different node.
    retries: 1
    retryCodes: "429,5xx"
  - id: r_7d2n5v8b1e
    name: fast
    nodes: [n_4q7a9x2m3k]
    strategy: round
