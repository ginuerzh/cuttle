gateway:
  listen: ":8787"

admin:
  listen: "127.0.0.1:8788"
  passwordHash: ""          # generate with: llm-gw hash-password < password.txt
  sessionTTL: 12h

stats:
  path: "stats.sqlite"
  retainRequests: 168h
  retainRollups: 2160h
  storeBody: false

aliases:
  - match: "claude-opus*"
    model: strong
  - match: "gpt-5.5*"
    model: strong
  - match: "claude-sonnet*"
    model: fast
  - match: "gpt-4.5*"
    model: fast
  - match: "claude-haiku*"
    model: fast
  - match: "*"
    model: fast

# A provider declares which wire APIs it serves and where; type selects the
# adapter. An empty API field means the provider does not serve that API.
providers:
  - name: deepseek
    type: deepseek
    chat: https://api.deepseek.com/v1
    responses: https://api.deepseek.com/v1
    anthropic: https://api.deepseek.com/anthropic
    keys:
      - ${DEEPSEEK_API_KEY}
    health:
      api: chat
      interval: 30s
      timeout: 5s

# A node is one concrete use of a provider: model mapping + routing policy.
# The same provider can back several nodes with different mappings.
nodes:
  - name: deepseek
    provider: deepseek
    models:
      fast: deepseek-v4-flash
      strong: deepseek-v4-pro
      "*": deepseek-v4-flash

routes:
  - name: strong
    nodes: [deepseek]
    match:
      model: strong
  - name: fast
    nodes: [deepseek]
    match:
      model: fast
