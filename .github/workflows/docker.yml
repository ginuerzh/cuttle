name: docker

# Builds the image from four repositories because llm-gw/go.mod uses local
# replace directives for core, x and llm-api-converter. The sibling refs are
# pinned so a dependency change is an explicit workflow update.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout llm-gw
        uses: actions/checkout@v4
        with:
          path: src/llm-gw

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: go-gost/core
          ref: v0.6.1
          path: src/core

      - name: Checkout x
        uses: actions/checkout@v4
        with:
          repository: go-gost/x
          ref: 5265f03275446d91d61a393243bc878ee7336928
          path: src/x

      - name: Checkout llm-api-converter
        uses: actions/checkout@v4
        with:
          repository: ginuerzh/llm-api-converter
          ref: e4c7c1a339426a62b157968641e5ca9735d270b7
          path: src/llm-api-converter


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
          labels: |
            org.opencontainers.image.title=llm-gw
            org.opencontainers.image.description=LLM gateway with an embedded admin console
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/llm-gw/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
